name: docs
on:
  push:
    paths: ['README.md', 'docs/**', 'CHANGELOG.md', '.env.example', 'scripts/start-demo.ps1', '.markdownlint-cli2.yaml', '.markdownlint.json', 'redocly.yaml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'CHANGELOG.md', '.env.example', 'scripts/start-demo.ps1', '.markdownlint-cli2.yaml', '.markdownlint.json', 'redocly.yaml', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "README.md" "docs/**/*.md" "CHANGELOG.md"
      - name: OpenAPI lint
        run: npx --yes @redocly/cli lint docs/openapi.yaml
      - name: Build report
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc docs/report/report.md -f markdown+raw_attribute+implicit_figures -o report.docx --reference-doc=docs/report/reference.docx --resource-path=docs/report:.
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.docx
