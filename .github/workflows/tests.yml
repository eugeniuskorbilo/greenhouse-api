concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

name: IoT PR8 - CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit, Integration, API and Coverage
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    timeout-minutes: 10

    env:
      NODE_ENV: test
      JWT_SECRET: github-actions-test-secret-at-least-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests and check coverage
        run: npm run test:coverage

      - name: Run property-based tests
        run: node --test property.test.js

      - name: Run mutation testing
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
  build-image:
    name: Build Docker Image
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t greenhouse-api:ci .

  publish-ghcr:
    name: Publish Docker image to GHCR
    needs: [tests, build-image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/eugeniuskorbilo/greenhouse-api:latest
